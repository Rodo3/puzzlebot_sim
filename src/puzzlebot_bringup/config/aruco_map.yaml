# Mapa de marcadores ArUco — Pista física
#
# Origen (0,0) = esquina inferior izquierda de la pista
# Unidades: metros
#
# Convención de yaw (dirección en que apunta la cara del marker = hacia dónde mira la cámara):
#   0.0    = marker apunta en +X (este)
#   1.5708 = marker apunta en +Y (norte)
#  -1.5708 = marker apunta en -Y (sur)
#   3.1416 = marker apunta en -X (oeste)
#
# Dimensiones de la pista:
#   Ancho: 3.76 m (eje X)
#   Alto:  4.86 m (eje Y)
#   Marker size: 0.10 m (10 cm)
#
# Para DICT_4X4_50, IDs válidos: 0–49

aruco_markers:
  # ID 1 — Pared norte (top), centro, mirando al sur
  1:
    x:      1.88
    y:      4.86
    z:      0.15
    roll:   0.0
    pitch:  0.0
    yaw:   -1.5708   # facing south (-Y)

  # ID 0 — Pared oeste (izquierda), parte alta, mirando al este
  0:
    x:      0.0
    y:      3.90      # 4.86 - 1.01 + 0.05
    z:      0.18
    roll:   0.0
    pitch:  0.0
    yaw:    0.0       # facing east (+X)

  # ID 4 — Pared oeste (izquierda), parte baja, mirando al este
  4:
    x:      0.0
    y:      1.04      # 0.99 + 0.05
    z:      0.18
    roll:   0.0
    pitch:  0.0
    yaw:    0.0       # facing east (+X)

  # ID 2 — Pared este (derecha), parte alta, mirando al oeste
  2:
    x:      3.76
    y:      3.90      # 4.86 - 1.01 + 0.05
    z:      0.18
    roll:   0.0
    pitch:  0.0
    yaw:    3.1416    # facing west (-X)

  # ID 3 — Pared este (derecha), parte baja, mirando al oeste
  3:
    x:      3.76
    y:      1.04      # 0.99 + 0.05
    z:      0.18
    roll:   0.0
    pitch:  0.0
    yaw:    3.1416    # facing west (-X)
