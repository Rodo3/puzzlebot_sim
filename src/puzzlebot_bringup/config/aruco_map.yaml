# Mapa de marcadores ArUco — Almacén (almacen_racks.sdf)
#
# Origen (0,0) = esquina inferior izquierda del almacén
# Unidades: metros / radianes
#
# CONVENCIÓN DE EJES (obj_pts de aruco_node: Y+ = arriba del marker, Z+ hacia
# la cámara). Para markers montados rectos en pared/rack, siempre roll=π/2.
# Con roll=π/2 y pitch=0, la dirección Z en el mapa = [sin(yaw), -cos(yaw), 0]:
#       yaw =  0     → Z apunta al sur  (-Y)
#       yaw =  π/2   → Z apunta al este (+X)
#       yaw = -π/2   → Z apunta al oeste(-X)
#       yaw =  π     → Z apunta al norte(+Y)
#
# IMPORTANTE: NO copiar roll/pitch/yaw directamente del <pose> del SDF.
# El modelo SDF es una caja cuya textura está en la cara +Z; su eje Y local
# queda horizontal, no "arriba". Copiarlo tal cual conserva el facing pero deja
# el marker girado 90° sobre su propio eje → solvePnP devuelve un yaw erróneo
# y el EKF rota el mapa completo 90°. Las poses de abajo ya están convertidas a
# la convención de aruco_node conservando exactamente el mismo facing del SDF.
#
# Dimensiones del almacén: 4.88 m (X) × 3.69 m (Y)
# Marker size físico: 0.09 m (caja 0.09×0.09×0.003 con textura en cara +Z)
# Diccionario de las texturas: DICT_ARUCO_ORIGINAL (no 4X4_50)

