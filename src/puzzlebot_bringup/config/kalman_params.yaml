kalman_filter_node:
  ros__parameters:
    process_noise_x:     0.01
    process_noise_y:     0.01
    process_noise_theta: 0.005
    meas_noise_x:        0.05
    meas_noise_y:        0.05
    meas_noise_theta:    0.01
    initial_covariance:  0.1
    # ── Pose inicial del robot al arrancar (frame: map) ──────────────────
    #
    # IMPORTANTE: el aruco_map.yaml define el origen (0,0) en la esquina
    # inferior-izquierda (SW) de la pista. El robot SIEMPRE debe arrancar
    # desde el mismo punto físico para que las correcciones ArUco sean válidas.
    #
    # Punto de arranque recomendado:
    #   • Posición: 30 cm adentro de la esquina SW (para no quedar pegado a paredes)
    #   • Orientación: mirando al norte (+Y) = π/2 rad
    #
    # Pista vista desde arriba:
    #
    #   Y=4.86 ┌──────[ID1]──────┐
    #          │                  │
    #   Y=3.90 [ID0]        [ID2] │
    #          │                  │
    #   Y=1.04 [ID4]        [ID3] │
    #          │                  │
    #   Y=0.00 └──────────────────┘
    #          X=0               X=3.76
    #
    #   ★ = punto de arranque → (0.30, 0.30, π/2)
    #       mirando hacia el norte (hacia ID1)
    #
    # SESIÓN 1 — Mapeo (slam:=true):
    #   Coloca el robot en la esquina SW mirando al norte y usa estos valores.
    #   El mapa se construirá con ese punto como origen.
    #
    # SESIÓN 2 — Localización MCL (slam:=false mcl:=true):
    #   Coloca el robot en el mismo punto físico de siempre.
    #   Ajusta initial_x/y/theta si usas un punto de inicio diferente.
    initial_x:      0.30     # usado solo si init_from_aruco: false
    initial_y:      0.30
    initial_theta:  1.5708

    # ── Inicialización desde ArUco ────────────────────────────────────────
    # Si true: el Kalman espera el primer /aruco/pose válido y usa esa pose
    # como estado inicial (reset directo, ganancia=1). El odómetro se ignora
    # hasta recibir la primera detección.
    # Si false: arranca desde initial_x/y/theta estático.
    init_from_aruco: true
