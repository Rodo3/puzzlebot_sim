slam_node:
  ros__parameters:
    # Grid geometry — pista física 3.76 m (X) × 4.86 m (Y) con margen.
    # Origen igual que aruco_map.yaml: esquina inferior izquierda (SW).
    # El margen evita cortar endpoints de pared por pequeños errores de pose.
    map_resolution:     0.05
    map_width_meters:   4.26    # 3.76 + 0.25 m por lado
    map_height_meters:  5.36    # 4.86 + 0.25 m por lado
    map_origin_x:      -0.25
    map_origin_y:      -0.25
    # Legacy fallback para launches antiguos que no definan width/height/resolution.
    map_size_pixels:   500
    map_size_meters:   25.0

    # Sensor model — inverse_sensor_model probabilities
    # p_occ  > 0.5 means cells hit by a beam endpoint become more occupied
    # p_free < 0.5 means cells along the beam path become more free
    # log_odds increments are derived: l = log(p/(1-p))
    p_occ:             0.80    # evidencia de obstáculo más fuerte
    p_free:            0.45    # limpieza conservadora para no borrar paredes por drift residual
    l_clamp:           5.0     # saturation limit

    # Beam processing
    scan_step:         1       # use every ray
    max_range_factor:  0.95    # rays >= 95% of range_max → no-hit (free only)
    min_useful_range:  0.20    # ignore beams shorter than 20 cm
    max_mapping_range: 5.5     # la pista mide <5.5 m; ignora lecturas lejanas/ruido

    # Frames
    map_frame:        'map'
    odom_frame:       'odom'
    publish_map_odom_tf: true

    # LiDAR pose respecto a base_footprint/base_link usada para proyectar rayos.
    # Ajusta x/y con medidas físicas desde el centro del eje de ruedas.
    # La corrección angular gruesa ya se hace en scan_restamper.
    lidar_x:   0.0
    lidar_y:   0.0
    lidar_yaw: 0.0

    # Pose/scan timing
    pose_buffer_sec:   3.0
    max_scan_pose_age: 0.20

    # Keyframes: solo integra un scan cuando el robot se movió lo suficiente.
    # Más separados → menos scans integrados → menos ruido acumulado en el mapa.
    use_keyframes:             true
    keyframe_min_translation:  0.10    # 10 cm mínimo de traslación (antes 8 cm)
    keyframe_min_rotation:     0.0873  # 5° mínimo de rotación (antes 3°)

    # Scan matching — ACTIVADO con kalman:=true (modo robot real).
    #
    # Con scan_match_updates_map_odom: false (activo cuando kalman:=true),
    # el matcher NO puede tocar el TF map→odom — el EKF/ArUco sigue siendo
    # el dueño de la localización.  El matcher SOLO refina la pose de cada
    # scan antes de integrarlo al mapa.  No hay feedback loop posible.
    #
    # Efecto: aunque el EKF llegue con 3–5° de drift, cada scan se coloca
    # en su posición óptima dentro del mapa ya construido → sin doble-pared.
    #
    # Para localización (MCL): dejar false — MCL tiene su propio mecanismo.
    scan_matching_enabled:     true

    # ── Scan match → EKF feedback (loop closure liviano) ────────────────────
    # Cuando el matcher encuentra una buena corrección (score ≥ min_score),
    # slam_node publica /scan_match/pose que el Kalman funde como medición
    # adicional (junto con ArUco).  Esto corrige el drift acumulado cuando el
    # robot vuelve a pasar por zonas ya mapeadas — loop closure sin pose graph.
    #
    # scan_match_min_score: mínimo de log-odds acumulado para confiar en el match.
    #   A 0.05m/px, l_occ≈1.39 por celda → score=15 ≈ 11 celdas de pared vistas.
    #   Sube si hay falsos loop closures; baja si las correcciones no llegan.
    scan_match_min_score:     15.0                #15 funciona bien 

    # Covarianza de la medición de scan match enviada al EKF.
    # Más conservadora que ArUco (que da σ_xy≈9cm): el matcher trabaja con un
    # mapa imperfecto, así que no es tan preciso como un marcador conocido.
    # scan_match_cov_xy: 0.04 m²  → σ_xy ≈ 20 cm  (floor de posición)
    # scan_match_cov_theta: 0.03 rad²  → σ_θ ≈ 10°  (floor de yaw)
    scan_match_cov_xy:         0.04      
    scan_match_cov_theta:      0.03

    # ── Fase 3: Covarianza adaptativa según score del matcher ────────────────
    #
    # Cuando el score del matcher es bajo (match marginal, pocas paredes visibles,
    # zona sin features), se infla la covarianza publicada en /scan_match/pose.
    # El EKF (kalman_filter_node) le dará menos peso automáticamente.
    # Cuando el score es alto (match limpio), la covarianza baja al valor base.
    #
    # Fórmula: cov_scale = min_score / score  (clampado entre [1/max_scale, 1.0])
    #   score = scan_match_min_score (15.0): cov_scale = 1.0   → cov base
    #   score = 2 × min_score        (30.0): cov_scale = 0.5   → cov × 0.5 (más confiable)
    #   score = 4 × min_score        (60.0): cov_scale = 0.25  → cov × 0.25 (muy confiable)
    #
    # Con max_scale=4.0: el piso de cov_scale es 0.25 (score muy alto no reduce más).
    # Efecto neto: zonas con pocas paredes → cov grande → EKF ignora match.
    #              Zonas con muchas paredes → cov pequeña → EKF acepta corrección.
    scan_match_cov_scale_by_score: true
    scan_match_max_cov_scale:      4.0
