# Calibración extrínseca cámara–robot (con lifter montado)
#
# Medidas físicas (lifter instalado):
#   z = 15.2 cm — altura desde el centro del robot hasta la cámara
#   x =  4.4 cm — distancia frontal desde la placa de montaje hasta la cámara
#   y =  0.0 cm — centrada lateralmente
#   La cámara apunta hacia el frente del robot (dirección de avance).
#
# Árbol TF:
#   map → odom → base_footprint → base_link → camera_link
#                                            → lidar_link

camera_extrinsics:
  parent_frame: base_link
  child_frame:  camera_link
  x:     0.152    # 15.2 cm adelante sobre el eje X de la placa
  y:     0.000    # centrado lateralmente
  z:     0.044    # 4.4 cm de altura sobre la placa
  roll:  0.0
  pitch: 0.0
  yaw:   0.0      # cámara apunta al frente del robot
