# Calibración extrínseca cámara–robot (con lifter montado)
#
# Medidas físicas (lifter instalado), referencia = centro de los motores:
#   x =  6.3 cm — adelante del robot
#   y = -7.5 cm — desplazada a la derecha (y- en convención ROS: y+ es izquierda)
#   z = 17.0 cm — altura desde el centro de los motores hasta la cámara
#
# Árbol TF:
#   map → odom → base_footprint → base_link → camera_link
#                                            → lidar_link

camera_extrinsics:
  parent_frame: base_link
  child_frame:  camera_link
  x:     0.13    # 6.3 cm adelante del centro de motores
  y:    0.075    # 7.5 cm a la derecha (y- en ROS)
  z:     0.12     # 17.0 cm de altura
  roll:  0.0
  pitch: 0.0
  yaw:   0.0      # cámara apunta al frente del robot
