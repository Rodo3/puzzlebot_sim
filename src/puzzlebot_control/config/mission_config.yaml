# ══════════════════════════════════════════════════════════════════════════════
#  MISSION CONFIG — state_machine_node (puzzlebot_control)
#
#  Parámetros de la misión logística de almacén:
#    escanear QR → recoger pallet → navegar a docks → identificar tráiler → depositar
#
#  Se carga con el parámetro mission_config_file. Las coordenadas de los
#  waypoints viven en puzzlebot_bringup/config/waypoints.yaml (parámetro
#  waypoints_file).
# ══════════════════════════════════════════════════════════════════════════════

# Mapeo string del QR → nombre de clase que publica el logo_detector.
# (El logo_detector usa: Pepsi / Amazon / Walmart)
qr_logo_map:
  wolmar: Walmart
  popsi: Pepsi
  emezon: Amazon

# Waypoint único de la zona de docks (desde donde se ven los 3 logos).
# Debe existir en waypoints.yaml.
dock_waypoint: dock_scan

# Waypoints que el robot recorre buscando el QR (Misión 1).
# Deben existir en waypoints.yaml.
patrol_waypoints: [estacion_a, estacion_b, estacion_c, estacion_d, estacion_e]

# Segundos en cada waypoint de patrulla escaneando el QR antes de avanzar
# al siguiente.
scan_timeout_sec: 8.0

# Confianza mínima del logo_detector para aceptar un match de logo.
logo_confidence_threshold: 0.70

# Tolerancia de llegada a waypoint (metros) — compara /odom con la coord del wp.
goal_reached_tolerance: 0.20

# Frames consecutivos con el mismo string de QR para aceptarlo como válido.
qr_stable_frames: 3

# Frames consecutivos con el mismo logo (≥ umbral) para aceptar el match.
logo_stable_frames: 5

# Segundos que el montacargas (stub) tarda en subir/bajar antes de continuar.
forklift_timeout_sec: 3.0

# Timeout total de búsqueda de logos en la zona de docks antes de ERROR (seg).
logo_scan_timeout_sec: 30.0
